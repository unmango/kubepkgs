name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: thecluster
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # thecluster's image ships a daemonless nix substituting from ncps and the runner has no sudo, so the installer and cachix's post-build hook have nothing to do there.
      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        if: matrix.runner != 'thecluster'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: matrix.runner != 'thecluster'

      - run: nix flake check --fallback

  # The main ruleset requires a status check named exactly `build`, which a matrix job cannot produce.
  build:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to have succeeded
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check: $RESULT"
          [ "$RESULT" = success ]
