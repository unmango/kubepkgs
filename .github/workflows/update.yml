name: Update

# Two independent jobs so a failure in one does not block the other, and so a
# new minor and unrelated patch bumps arrive as separate reviewable PRs.
#
# Neither job runs `nix flake check`: the PR it opens triggers ci.yml, which
# builds the whole matrix. Paying for that twice buys nothing, and a red PR is
# more useful than a run that silently produced nothing.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, matching renovate's cadence
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  minor:
    name: New Kubernetes minor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # add-minor is a no-op when the newest minor upstream is already tracked,
      # so this runs unconditionally and create-pull-request skips on a clean tree.
      - run: make add-minor generate-hashes vendor-hashes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/add-minor
          title: "feat: track a new kubernetes minor"
          commit-message: "feat: track a new kubernetes minor"
          body: |
            Generated by `make add-minor generate-hashes vendor-hashes`.

            The new minor inherits its SIG pins from the minor that was newest before it;
            moving a SIG to a new version stays a separate change.

  patches:
    name: Patch bumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - run: make update-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/patch-bumps
          title: "deps: bump tracked patch versions"
          commit-message: "deps: bump tracked patch versions"
          body: |
            Generated by `make update-releases`.

            Every package stays inside the minor series it is already pinned to.
